name: Storybook — Test & Publish

on:
  push:
    branches: [main]
    paths:
      - 'src/components/**'
      - 'src/mocks/**'
      - 'src/lib/**'
      - 'src/app/globals.css'
      - '.storybook/**'
      - 'e2e/storybook/**'
      - 'playwright.storybook.config.ts'
      - 'package*.json'
      - '.github/workflows/storybook.yml'
  pull_request:
    paths:
      - 'src/components/**'
      - 'src/mocks/**'
      - 'src/lib/**'
      - 'src/app/globals.css'
      - '.storybook/**'
      - 'e2e/storybook/**'
      - 'playwright.storybook.config.ts'
      - 'package*.json'
      - '.github/workflows/storybook.yml'

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write  # for posting VRT diff comments

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Build Storybook
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run storybook:build
        env:
          # Storybook needs a dummy env so Next.js env validation passes
          NEXT_PUBLIC_API_URL: http://localhost:8081
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_STELLAR_TESTNET_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4

      - name: Upload Storybook build artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Storybook test runner (interaction tests + a11y)
  # ────────────────────────────────────────────────────────────────────────────
  test-runner:
    name: Test Runner (interactions + a11y)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Storybook build
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Storybook test runner
        run: npm run storybook:test
        env:
          # Point the test runner at the static build served by the built-in
          # reference server that test-runner starts automatically.
          TARGET_URL: http://localhost:6006
          # Fail CI on any a11y violation
          SB_TESTRUNNER_SKIP_STORIES_FILE: ''

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-test-results
          path: |
            test-results/
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Visual regression tests (Playwright screenshot comparison)
  # ────────────────────────────────────────────────────────────────────────────
  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Download Storybook build
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/

      - name: Serve Storybook static build
        run: |
          npx serve storybook-static --listen 6006 &
          # Wait for the server to be ready
          npx wait-on http://localhost:6006 --timeout 30000
        env:
          CI: true

      - name: Run VRT screenshots
        run: npm run test:vrt
        env:
          CI: true
          STORYBOOK_URL: http://localhost:6006

      - name: Upload VRT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-report-${{ github.run_id }}
          path: |
            playwright-report/storybook-vrt/
            test-results/
          retention-days: 30

      - name: Comment VRT diff on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const artifactUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 📸 Visual Regression Differences Detected\n\nScreenshot diffs were found. Download the **[VRT report artifact](${artifactUrl})** to review pixel-level differences.\n\nTo update baselines:\n\`\`\`bash\nnpx playwright test --config playwright.storybook.config.ts --update-snapshots\ngit add e2e/storybook/__snapshots__\ngit commit -m "chore: update VRT snapshots"\n\`\`\``,
            });

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Publish Storybook to GitHub Pages (main branch only)
  # ────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish Storybook to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test-runner, visual-regression]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download Storybook build
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
