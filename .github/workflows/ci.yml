# .github/workflows/ci.yml
#
# Main CI pipeline — runs on every PR and on pushes to main.
# Jobs run in parallel; total wall-clock time target is < 10 minutes.
#
# Job graph:
#
#   setup (implicit in each job via composite action)
#   ├── lint        — next lint, zero warnings
#   ├── typecheck   — tsc --noEmit
#   ├── unit        — Jest with coverage upload
#   └── build       — next build (restores .next/cache)
#
# Bundle budget reporting runs as a separate workflow (bundle.yml) so it can
# post PR comments independently.  If you prefer a single file you can inline
# the bundle job here and add `needs: [build]`.
#
# See CONTRIBUTING.md §CI for branch protection setup.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so each push only bills one run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege permissions; individual jobs add what they need.
permissions:
  contents: read

env:
  # Required by Next.js env validation in src/env.ts at build time.
  # These are safe dummy values — nothing is deployed from CI.
  NEXT_PUBLIC_API_URL: http://localhost:8081
  NEXT_PUBLIC_STELLAR_NETWORK: testnet
  NEXT_PUBLIC_STELLAR_TESTNET_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4

# ─────────────────────────────────────────────────────────────────────────────
# LINT
# Runs next lint. Treats any warning as an error (--max-warnings 0).
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
        # The composite action does: checkout → setup-node (from .nvmrc) → npm ci

      - name: Lint
        run: npm run lint:ci

  # ───────────────────────────────────────────────────────────────────────────
  # TYPECHECK
  # Runs tsc --noEmit against the project's tsconfig.json.
  # ───────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup

      - name: Typecheck
        run: npm run typecheck

  # ───────────────────────────────────────────────────────────────────────────
  # UNIT TESTS
  # Runs Jest with coverage; uploads the report so it's visible in the
  # GitHub Actions summary and can be picked up by third-party coverage
  # reporters (Codecov, Coveralls, etc.) if added later.
  # ───────────────────────────────────────────────────────────────────────────
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup

      - name: Run unit tests with coverage
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────────
  # BUILD
  # Runs `next build`. The .next/cache is restored between runs so
  # incremental builds are fast. The build artifact is uploaded so the
  # bundle workflow can analyse it without re-building.
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup

      # Restore the Next.js incremental build cache. Key includes a hash of
      # package-lock.json so the cache is invalidated when deps change.
      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Build
        run: npm run build

      # Upload the production build so the bundle job can measure it without
      # running next build a second time.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.sha }}
          path: |
            .next/
            !.next/cache
          retention-days: 1
